# ── PostgreSQL datasource (production profile) ────────────────────────────────
# Activate with: -Dspring.profiles.active=prod
# Uncomment and fill in the values for your production environment.

# spring.datasource.url=jdbc:postgresql://<host>:<port>/<database>
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=<username>
# spring.datasource.password=<password>

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=validate

# ── Connection pool (HikariCP defaults are usually fine; tune as needed) ──────
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=2
# spring.datasource.hikari.connection-timeout=30000

# ── H2 console must be disabled in production ─────────────────────────────────
spring.h2.console.enabled=false
